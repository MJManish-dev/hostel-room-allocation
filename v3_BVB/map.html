<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostel Allotment</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/map.css">
</head>

<body>

    <header>
        <nav>
            <div class="logo">HostelEase</div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="map.html" class="active">Room Map</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>BVB Hostel</h2>
        <button id="reset-button" class="btn-cancel">Reset All Allocations</button>
        <button id="download-csv-btn">Download CSV Report</button>
        <button id="backup-data-btn">Backup Data</button>
        <button id="restore-data-btn">Restore from Backup</button>
        <input type="file" id="restore-file-input" accept=".json" style="display: none;">
        <p>Click a room to manage its allocation. Hover to see details.</p>

        <div class="navigation-panel">
            <div class="block-selector">
                <strong>Block:</strong>
                <button class="block-btn active" data-block="bvb">BVB Hostel</button>
            </div>
            <div class="floor-selector">
                <strong>Floor:</strong>
                <button class="floor-btn" data-floor="bvb-floor-2">Floor 2</button>
                <button class="floor-btn active" data-floor="bvb-floor-3">Floor 3</button>
            </div>
        </div>

        <div class="map-and-info">
            <div class="map-container">
            </div>

            <div id="room-info-panel">
                <h3>Room Details</h3>
                <p>Loading map...</p>
            </div>
        </div>

        <div id="allocation-modal" class="modal-overlay">
            <div class="modal-content">
                <span class="modal-close-button" aria-label="Close modal">&times;</span>
                <h3 id="modal-title">Allocate Room</h3>

                <form id="allocation-form">
                    <input type="hidden" id="modal-room-id" value="">

                    <div class="form-group">
                        <label for="student-name">Student Name:</label>
                        <input type="text" id="student-name" required>
                    </div>

                    <div class="form-group">
                        <label for="student-id">Student ID:</label>
                        <input type="text" id="student-id" required>
                    </div>

                    <div class="form-buttons">
                        <button type="submit" class="btn-allocate">Allocate Room</button>
                        <button type="button" class="btn-cancel modal-cancel-btn">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

    </main>

    <footer>
        <p>&copy; 2025 - By Harshal:)</p>
    </footer>

    <script src="js/map.js" defer></script>
</body>

</html>
